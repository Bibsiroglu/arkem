<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site & Emlak Yönetim Paneli</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome İkonları -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800">

  <!-- Navbar -->
  <nav class="bg-indigo-600 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-building"></i> Emlak & Site Yönetimi
      </h1>
      <button onclick="openTenantModal()" class="bg-indigo-800 hover:bg-indigo-900 text-white px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> Yeni Site Ekle
      </button>
    </div>
  </nav>

  <!-- Ana İçerik Container -->
  <main class="max-w-7xl mx-auto px-4 py-8">

    <!-- Dashboard / İstatistik Kartları -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-indigo-500">
        <p class="text-sm text-gray-500 uppercase font-semibold">Toplam Site</p>
        <h3 id="statTenants" class="text-3xl font-bold text-gray-800 mt-2">0</h3>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-blue-500">
        <p class="text-sm text-gray-500 uppercase font-semibold">Toplam Daire</p>
        <h3 id="statApartments" class="text-3xl font-bold text-gray-800 mt-2">0</h3>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-green-500">
        <p class="text-sm text-gray-500 uppercase font-semibold">Tahsil Edilen Aidat</p>
        <h3 id="statCollected" class="text-3xl font-bold text-green-600 mt-2">₺0.00</h3>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-red-500">
        <p class="text-sm text-gray-500 uppercase font-semibold">Bekleyen Ödeme</p>
        <h3 id="statPending" class="text-3xl font-bold text-red-600 mt-2">₺0.00</h3>
      </div>
    </div>

    <!-- Siteler Listesi -->
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold text-gray-700">Kayıtlı Siteler</h2>
      <button onclick="loadDashboard()" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium">
        <i class="fa-solid fa-rotate"></i> Yenile
      </button>
    </div>

    <div id="tenantsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- JavaScript ile Siteler Kart Olarak Buraya Yüklenecek -->
    </div>
  </main>

  <!-- SİTE EKLEME MODAL -->
  <div id="tenantModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6">
      <h3 class="text-lg font-bold mb-4">Yeni Site Ekle</h3>
      <form id="tenantForm" onsubmit="handleSaveTenant(event)">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Site / Apt Adı</label>
          <input type="text" id="tenantName" required placeholder="Örn: Güneş Sitesi" class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Adres</label>
          <textarea id="tenantAddress" rows="3" placeholder="Açık adres..." class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeTenantModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">İptal</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DAİRELER VE AİDAT DETAY MODAL -->
  <div id="apartmentModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-4xl w-full p-6 max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center border-b pb-4 mb-4">
        <div>
          <h3 id="modalTitle" class="text-xl font-bold text-gray-800">Site Detayları</h3>
          <input type="hidden" id="activeTenantId">
        </div>
        <div class="flex gap-2">
          <button onclick="exportToCSV()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5">
            <i class="fa-solid fa-file-excel"></i> Excel İndir
          </button>
          <button onclick="closeApartmentModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
        </div>
      </div>

      <!-- Yeni Daire Ekleme Formu -->
      <form id="apartmentForm" onsubmit="handleAddApartment(event)" class="bg-gray-50 p-4 rounded-lg mb-4 grid grid-cols-1 md:grid-cols-4 gap-3">
        <input type="text" id="aptNo" placeholder="Daire No *" required class="border px-3 py-2 rounded-lg outline-none">
        <input type="text" id="aptResident" placeholder="Sakin Adı" class="border px-3 py-2 rounded-lg outline-none">
        <input type="text" id="aptPhone" placeholder="Telefon" class="border px-3 py-2 rounded-lg outline-none">
        <button type="submit" class="bg-indigo-600 text-white rounded-lg px-4 py-2 font-medium hover:bg-indigo-700">Daire Ekle</button>
      </form>

      <!-- Daireler Tablosu -->
      <div class="overflow-y-auto flex-1">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-100 text-gray-600 text-xs font-semibold uppercase">
              <th class="p-3">Daire No</th>
              <th class="p-3">Sakin</th>
              <th class="p-3">Telefon</th>
              <th class="p-3">Son Aidat Durumu</th>
              <th class="p-3 text-right">İşlemler</th>
            </tr>
          </thead>
          <tbody id="apartmentsTableBody" class="divide-y text-sm">
            <!-- Daireler JS ile Buraya Gelecek -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- AİDAT / BORÇ YÖNETİMİ MODAL -->
  <div id="paymentModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-6">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 id="paymentModalTitle" class="text-lg font-bold">Daire Aidat Yönetimi</h3>
        <button onclick="closePaymentModal()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
      </div>

      <input type="hidden" id="activeApartmentId">

      <!-- Yeni Aidat Ekleme Formu -->
      <form id="paymentForm" onsubmit="handleAddPayment(event)" class="space-y-3 mb-6">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Dönem (Örn: Ağustos 2026)</label>
          <input type="text" id="payPeriod" placeholder="Ağustos 2026" required class="w-full border px-3 py-2 rounded-lg outline-none text-sm">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Tutar (TL)</label>
            <input type="number" step="0.01" id="payAmount" placeholder="750.00" required class="w-full border px-3 py-2 rounded-lg outline-none text-sm">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Durum</label>
            <select id="payStatus" class="w-full border px-3 py-2 rounded-lg outline-none text-sm">
              <option value="Ödenmedi">Ödenmedi</option>
              <option value="Ödendi">Ödendi</option>
            </select>
          </div>
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium text-sm hover:bg-indigo-700">
          Borç / Aidat Ekle
        </button>
      </form>

      <!-- Geçmiş Aidat Geçmişi -->
      <h4 class="text-xs font-bold text-gray-500 uppercase mb-2">Aidat Geçmişi</h4>
      <div class="max-h-48 overflow-y-auto border rounded-lg divide-y">
        <ul id="paymentsList" class="divide-y text-sm">
          <!-- JS ile Yüklenecek -->
        </ul>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT MANTIĞI -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      loadDashboard();
    });

    // --- DASHBOARD & SİTELERİ YÜKLE ---
    async function loadDashboard() {
      try {
        // Stats
        const statsRes = await fetch('/api/stats');
        const stats = await statsRes.json();
        
        document.getElementById('statTenants').innerText = stats.totalTenants;
        document.getElementById('statApartments').innerText = stats.totalApartments;
        document.getElementById('statCollected').innerText = `₺${stats.totalCollected.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;
        document.getElementById('statPending').innerText = `₺${stats.totalPending.toLocaleString('tr-TR', {minimumFractionDigits: 2})}`;

        // Tenants List
        const tenantsRes = await fetch('/api/tenants');
        const tenants = await tenantsRes.json();
        
        const tenantsList = document.getElementById('tenantsList');
        tenantsList.innerHTML = '';

        if (tenants.length === 0) {
          tenantsList.innerHTML = `<div class="col-span-full text-center py-8 text-gray-500">Henüz hiç site eklenmemiş.</div>`;
          return;
        }

        tenants.forEach(tenant => {
          tenantsList.innerHTML += `
            <div class="bg-white rounded-xl p-5 shadow-md hover:shadow-lg transition border border-gray-100 flex flex-col justify-between">
              <div>
                <h3 class="font-bold text-lg text-gray-800 mb-1">${tenant.name}</h3>
                <p class="text-xs text-gray-500 mb-4">${tenant.address || 'Adres belirtilmemiş'}</p>
              </div>
              <div class="flex justify-between items-center pt-3 border-t">
                <button onclick="openApartmentModal(${tenant.id}, '${tenant.name}')" class="text-indigo-600 hover:text-indigo-800 text-sm font-semibold flex items-center gap-1">
                  Daireler & Detay <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
                <button onclick="deleteTenant(${tenant.id})" class="text-red-500 hover:text-red-700 text-sm">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </div>
            </div>
          `;
        });
      } catch (err) {
        console.error('Yükleme hatası:', err);
      }
    }

    // --- SİTE EKLEME / SİLME ---
    function openTenantModal() { document.getElementById('tenantModal').classList.remove('hidden'); }
    function closeTenantModal() { document.getElementById('tenantModal').classList.add('hidden'); }

    async function handleSaveTenant(e) {
      e.preventDefault();
      const name = document.getElementById('tenantName').value;
      const address = document.getElementById('tenantAddress').value;

      await fetch('/api/tenants', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, address })
      });

      document.getElementById('tenantForm').reset();
      closeTenantModal();
      loadDashboard();
    }

    async function deleteTenant(id) {
      if (!confirm('Bu siteyi ve bağlı tüm daireleri silmek istediğinize emin misiniz?')) return;
      await fetch(`/api/tenants/${id}`, { method: 'DELETE' });
      loadDashboard();
    }

    // --- DAİRELERİ YÜKLEME ---
    async function openApartmentModal(tenantId, tenantName) {
      document.getElementById('activeTenantId').value = tenantId;
      document.getElementById('modalTitle').innerText = `${tenantName} - Daireler`;
      document.getElementById('apartmentModal').classList.remove('hidden');
      loadApartments(tenantId);
    }

    function closeApartmentModal() {
      document.getElementById('apartmentModal').classList.add('hidden');
    }

    async function loadApartments(tenantId) {
      const res = await fetch(`/api/tenants/${tenantId}/apartments`);
      const apartments = await res.json();
      const tbody = document.getElementById('apartmentsTableBody');
      tbody.innerHTML = '';

      if (apartments.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">Daire bulunamadı.</td></tr>`;
        return;
      }

      for (const apt of apartments) {
        tbody.innerHTML += `
          <tr class="hover:bg-gray-50">
            <td class="p-3 font-semibold text-gray-700">Daire ${apt.apartment_number}</td>
            <td class="p-3">${apt.resident_name || '-'}</td>
            <td class="p-3">${apt.phone || '-'}</td>
            <td class="p-3">
              <button onclick="openPaymentModal(${apt.id}, '${apt.apartment_number}')" class="text-xs bg-indigo-50 text-indigo-600 border border-indigo-200 px-2.5 py-1 rounded-full font-medium hover:bg-indigo-100">
                <i class="fa-solid fa-wallet"></i> Aidat Yönetimi
              </button>
            </td>
            <td class="p-3 text-right">
              <button onclick="deleteApartment(${apt.id})" class="text-red-500 hover:text-red-700">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
        `;
      }
    }

    async function handleAddApartment(e) {
      e.preventDefault();
      const tenantId = document.getElementById('activeTenantId').value;
      const apartment_number = document.getElementById('aptNo').value;
      const resident_name = document.getElementById('aptResident').value;
      const phone = document.getElementById('aptPhone').value;

      await fetch(`/api/tenants/${tenantId}/apartments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ apartment_number, resident_name, phone })
      });

      document.getElementById('apartmentForm').reset();
      loadApartments(tenantId);
      loadDashboard();
    }

    async function deleteApartment(id) {
      if (!confirm('Daireyi silmek istiyor musunuz?')) return;
      const tenantId = document.getElementById('activeTenantId').value;
      await fetch(`/api/apartments/${id}`, { method: 'DELETE' });
      loadApartments(tenantId);
      loadDashboard();
    }

    // --- AİDAT / PAYMENTS YÖNETİMİ ---
    async function openPaymentModal(aptId, aptNo) {
      document.getElementById('activeApartmentId').value = aptId;
      document.getElementById('paymentModalTitle').innerText = `Daire ${aptNo} - Aidat Geçmişi`;
      document.getElementById('paymentModal').classList.remove('hidden');
      loadPayments(aptId);
    }

    function closePaymentModal() {
      document.getElementById('paymentModal').classList.add('hidden');
    }

    async function loadPayments(aptId) {
      const res = await fetch(`/api/apartments/${aptId}/payments`);
      const payments = await res.json();
      const list = document.getElementById('paymentsList');
      list.innerHTML = '';

      if (payments.length === 0) {
        list.innerHTML = `<li class="p-3 text-center text-gray-400">Aidat kaydı bulunamadı.</li>`;
        return;
      }

      payments.forEach(pay => {
        const isPaid = pay.status === 'Ödendi';
        list.innerHTML += `
          <li class="p-3 flex justify-between items-center">
            <div>
              <span class="font-medium text-gray-700">${pay.period}</span>
              <span class="text-xs text-gray-400 block">₺${parseFloat(pay.amount).toFixed(2)}</span>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="togglePaymentStatus(${pay.id})" class="px-2.5 py-1 text-xs rounded-full font-semibold ${isPaid ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                ${pay.status}
              </button>
              <button onclick="deletePayment(${pay.id})" class="text-gray-400 hover:text-red-500 text-xs">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </li>
        `;
      });
    }

    async function handleAddPayment(e) {
      e.preventDefault();
      const aptId = document.getElementById('activeApartmentId').value;
      const period = document.getElementById('payPeriod').value;
      const amount = document.getElementById('payAmount').value;
      const status = document.getElementById('payStatus').value;

      await fetch(`/api/apartments/${aptId}/payments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ period, amount, status })
      });

      document.getElementById('paymentForm').reset();
      loadPayments(aptId);
      loadDashboard();
    }

    async function togglePaymentStatus(id) {
      const aptId = document.getElementById('activeApartmentId').value;
      await fetch(`/api/payments/${id}/toggle`, { method: 'PUT' });
      loadPayments(aptId);
      loadDashboard();
    }

    async function deletePayment(id) {
      const aptId = document.getElementById('activeApartmentId').value;
      await fetch(`/api/payments/${id}`, { method: 'DELETE' });
      loadPayments(aptId);
      loadDashboard();
    }

    // --- CSV / EXCEL DIŞA AKTAR (EXPORTS TO CSV) ---
    async function exportToCSV() {
      const tenantId = document.getElementById('activeTenantId').value;
      const modalTitle = document.getElementById('modalTitle').innerText;
      const tenantName = modalTitle.replace(' - Daireler', '');

      try {
        const aptRes = await fetch(`/api/tenants/${tenantId}/apartments`);
        const apartments = await aptRes.json();

        if (!apartments || apartments.length === 0) {
          alert('İndirilecek daire verisi bulunamadı.');
          return;
        }

        let csvContent = "\uFEFFDaire No,Sakin Adı,Telefon,Aidat Dönemi,Tutar (TL),Ödeme Durumu\n";

        for (const apt of apartments) {
          const payRes = await fetch(`/api/apartments/${apt.id}/payments`);
          const payments = await payRes.json();

          const aptNo = `"${apt.apartment_number || ''}"`;
          const resName = `"${apt.resident_name || 'Boş'}"`;
          const phone = `"${apt.phone || ''}"`;

          if (!payments || payments.length === 0) {
            csvContent += `${aptNo},${resName},${phone},"---","---","Kayıt Yok"\n`;
          } else {
            payments.forEach(pay => {
              const period = `"${pay.period || ''}"`;
              const amount = `"${pay.amount || 0}"`;
              const status = `"${pay.status || 'Ödenmedi'}"`;
              csvContent += `${aptNo},${resName},${phone},${period},${amount},${status}\n`;
            });
          }
        }

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', `${tenantName}_Daire_ve_Aidat_Listesi.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

      } catch (err) {
        console.error('CSV indirme hatası:', err);
        alert('Excel dosyası oluşturulurken bir hata oluştu.');
      }
    }
  </script>
</body>
</html>
