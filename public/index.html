<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emlak & Site Yönetimi</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome İkon Seti -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <!-- HEADER / ÜST BAR -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-building"></i> Emlak & Site Yönetimi
      </h1>
      <button onclick="openTenantModal()" class="bg-indigo-800 hover:bg-indigo-900 text-white px-4 py-2 rounded-lg font-medium text-sm transition shadow flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> Yeni Site Ekle
      </button>
    </div>
  </header>

  <!-- ANA İÇERİK CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- STATS (ÖZET KARTLARI) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-indigo-500">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Toplam Site</p>
        <h3 id="statTenants" class="text-3xl font-extrabold text-gray-800 mt-2">0</h3>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Toplam Daire</p>
        <h3 id="statApartments" class="text-3xl font-extrabold text-gray-800 mt-2">0</h3>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-emerald-500">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Tahsil Edilen Aidat</p>
        <h3 id="statCollected" class="text-3xl font-extrabold text-emerald-600 mt-2">₺0,00</h3>
      </div>
      <div class="bg-white p-6 rounded-xl shadow-sm border-l-4 border-rose-500">
        <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Bekleyen Ödeme</p>
        <h3 id="statPending" class="text-3xl font-extrabold text-rose-600 mt-2">₺0,00</h3>
      </div>
    </div>

    <!-- SİTELER BAŞLIK VE CANLI ARAMA ÇUBUĞU -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
      <h2 class="text-xl font-bold text-gray-700">Kayıtlı Siteler</h2>
      
      <div class="flex items-center gap-3 w-full sm:w-auto">
        <!-- Site Arama Inputu -->
        <div class="relative w-full sm:w-64">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
          <input 
            type="text" 
            id="tenantSearchInput" 
            oninput="filterTenants()" 
            placeholder="Site adı veya adres ara..." 
            class="w-full pl-9 pr-4 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white shadow-sm"
          >
        </div>
        <button onclick="loadDashboard()" class="text-indigo-600 hover:text-indigo-800 text-sm font-medium whitespace-nowrap flex items-center gap-1">
          <i class="fa-solid fa-rotate"></i> Yenile
        </button>
      </div>
    </div>

    <!-- SİTELER KART LİSTESİ -->
    <div id="tenantsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- JavaScript dinamik olarak doldurur -->
    </div>

  </main>


  <!-- ==================== MODALS (AÇILIR PENCERELER) ==================== -->

  <!-- 1. YENİ SİTE EKLEME MODALI -->
  <div id="tenantModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-gray-800">Yeni Site Ekle</h3>
        <button onclick="closeTenantModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>
      <form id="tenantForm" onsubmit="handleSaveTenant(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Site Adı</label>
          <input type="text" id="tenantName" required placeholder="Örn: Güneş Sitesi" class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Adres</label>
          <textarea id="tenantAddress" placeholder="Örn: Merkez/Kastamonu" rows="3" class="w-full p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeTenantModal()" class="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">İptal</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">Kaydet</button>
        </div>
      </form>
    </div>
  </div>
  
  <!-- 2. DAİRELER MODALI -->
  <div id="apartmentModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-4xl w-full max-h-[90vh] overflow-y-auto p-6 relative shadow-2xl">
      
      <input type="hidden" id="activeTenantId">

      <!-- Modal Başlık, CSV İndir ve Kapat Butonu -->
      <div class="flex justify-between items-center mb-6 border-b pb-4">
        <h3 id="modalTitle" class="text-xl font-bold text-gray-800">Daireler</h3>
        <div class="flex items-center gap-3">
          <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-1.5 shadow-sm">
            <i class="fa-solid fa-file-excel"></i> Excel (CSV) İndir
          </button>
          <button onclick="closeApartmentModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold leading-none px-2">&times;</button>
        </div>
      </div>

<!-- 🔍 DAİRE ARAMA ÇUBUĞU + BORÇLU FİLTRESİ -->
      <div class="flex flex-col sm:flex-row gap-3 mb-6">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input 
            type="text" 
            id="apartmentSearchInput" 
            oninput="filterApartments()" 
            placeholder="Daire no, sakin adı veya telefon ara..." 
            class="w-full pl-10 pr-4 py-2.5 border border-gray-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none shadow-sm transition"
          >
        </div>
        
        <!-- Sadece Borçlular Filtre Butonu -->
        <button 
          id="toggleDebtFilterBtn" 
          onclick="toggleDebtFilter()" 
          class="px-4 py-2.5 bg-gray-100 hover:bg-red-50 text-gray-600 hover:text-red-600 border border-gray-200 hover:border-red-200 rounded-xl text-sm font-medium transition flex items-center justify-center gap-2 whitespace-nowrap shadow-sm"
        >
          <i class="fa-solid fa-filter"></i> Sadece Borçlular
        </button>
      </div>

      <!-- YENİ DAİRE EKLE FORM -->
      <form id="apartmentForm" onsubmit="handleAddApartment(event)" class="bg-gray-50 p-4 rounded-xl mb-6 grid grid-cols-1 sm:grid-cols-4 gap-3 border border-gray-100">
        <input type="text" id="aptNo" placeholder="Daire No (Örn: 5)" required class="p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
        <input type="text" id="aptResident" placeholder="Sakin Adı Soyadı" class="p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
        <input type="text" id="aptPhone" placeholder="Telefon" class="p-2.5 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm flex items-center justify-center gap-1">
          <i class="fa-solid fa-plus"></i> Daire Ekle
        </button>
      </form>

      <!-- DAİRELER TABLOSU -->
      <div class="overflow-x-auto border rounded-xl">
        <table class="w-full text-left text-sm text-gray-600">
          <thead class="bg-gray-100 text-gray-700 font-semibold border-b">
            <tr>
              <th class="p-3">Daire No</th>
              <th class="p-3">Sakin Adı</th>
              <th class="p-3">Telefon</th>
              <th class="p-3">Aidat Durumu</th>
              <th class="p-3 text-right">İşlem</th>
            </tr>
          </thead>
          <tbody id="apartmentsTableBody" class="divide-y divide-gray-100 bg-white">
            <!-- JavaScript dinamik dolduracak -->
          </tbody>
        </table>
      </div>

    </div>
  </div>


  <!-- 3. AİDAT / PAYMENTS MODALI -->
  <div id="paymentModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
      <input type="hidden" id="activeApartmentId">
      
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h3 id="paymentModalTitle" class="text-lg font-bold text-gray-800">Aidat Yönetimi</h3>
        <button onclick="closePaymentModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <!-- YENİ AİDAT EKLE FORM -->
      <form id="paymentForm" onsubmit="handleAddPayment(event)" class="bg-gray-50 p-4 rounded-xl mb-4 grid grid-cols-1 sm:grid-cols-3 gap-2 border border-gray-100">
        <input type="text" id="payPeriod" placeholder="Dönem (Ocak 2026)" required class="p-2 border rounded text-xs outline-none bg-white">
        <input type="number" step="0.01" id="payAmount" placeholder="Tutar (TL)" required class="p-2 border rounded text-xs outline-none bg-white">
        <select id="payStatus" class="p-2 border rounded text-xs outline-none bg-white">
          <option value="Ödenmedi">Ödenmedi</option>
          <option value="Ödendi">Ödendi</option>
        </select>
        <button type="submit" class="sm:col-span-3 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded text-xs transition mt-1">
          + Aidat Kaydı Ekle
        </button>
      </form>

      <!-- AİDAT GEÇMİŞİ LİSTESİ -->
      <ul id="paymentsList" class="divide-y divide-gray-100 border rounded-xl max-h-60 overflow-y-auto">
        <!-- JavaScript doldurur -->
      </ul>
    </div>
  </div>


<script>
    let allApartments = [];
    let showOnlyDebt = false;

    // Modal Açma Fonksiyonu
    async function openApartmentModal(tenantId, tenantName) {
      document.getElementById('activeTenantId').value = tenantId;
      document.getElementById('modalTitle').innerText = `${tenantName} - Daireler`;
      document.getElementById('apartmentModal').classList.remove('hidden');
      
      const aptSearchInput = document.getElementById('apartmentSearchInput');
      if (aptSearchInput) aptSearchInput.value = '';
      
      // Filtreyi sıfırla
      showOnlyDebt = false;
      updateDebtFilterBtnStyle();

      loadApartments(tenantId);
    }

    // Daire Verilerini ve Aidat/Borç Durumlarını Çekme
    async function loadApartments(tenantId) {
      const res = await fetch(`/api/tenants/${tenantId}/apartments`);
      allApartments = await res.json();

      // Her daire için ödenmemiş toplam borç tutarını hesapla
      for (let apt of allApartments) {
        try {
          const payRes = await fetch(`/api/apartments/${apt.id}/payments`);
          const payments = await payRes.json();
          
          // Durumu 'Ödenmedi' olanların tutarlarını topla
          const totalDebt = payments
            .filter(p => p.status === 'Ödenmedi')
            .reduce((sum, p) => sum + parseFloat(p.amount || 0), 0);
          
          apt.totalDebt = totalDebt;
          apt.hasDebt = totalDebt > 0;
        } catch (e) {
          apt.totalDebt = 0;
          apt.hasDebt = false;
        }
      }

      filterApartments();
    }

    // Tabloyu Ekrana Basma
    function renderApartments(apartmentsToRender) {
      const tbody = document.getElementById('apartmentsTableBody');
      tbody.innerHTML = '';

      if (apartmentsToRender.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">Aranan kriterlere uygun daire bulunamadı.</td></tr>`;
        return;
      }

      apartmentsToRender.forEach(apt => {
        // Tutar içeren kırmızı uyarı rozeti
        const debtBadge = apt.hasDebt 
          ? `<span class="inline-flex items-center gap-1 bg-red-100 text-red-700 text-xs px-2.5 py-1 rounded-full font-semibold border border-red-200 shadow-sm">
               <i class="fa-solid fa-triangle-exclamation"></i> ₺${apt.totalDebt.toLocaleString('tr-TR', {minimumFractionDigits: 2})} Borç
             </span>`
          : '';

        tbody.innerHTML += `
          <tr class="hover:bg-gray-50">
            <td class="p-3 font-semibold text-gray-700">Daire ${apt.apartment_number}</td>
            <td class="p-3">
              <div class="flex items-center gap-2">
                <span>${apt.resident_name || '-'}</span>
                ${debtBadge}
              </div>
            </td>
            <td class="p-3">${apt.phone || '-'}</td>
            <td class="p-3">
              <button onclick="openPaymentModal(${apt.id}, '${apt.apartment_number}')" class="text-xs bg-indigo-50 text-indigo-600 border border-indigo-200 px-2.5 py-1 rounded-full font-medium hover:bg-indigo-100 transition">
                <i class="fa-solid fa-wallet"></i> Aidat Yönetimi
              </button>
            </td>
            <td class="p-3 text-right">
              <button onclick="deleteApartment(${apt.id})" class="text-red-500 hover:text-red-700">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
        `;
      });
    }

    // Arama ve Borç Filtresini Birlikte Çalıştıran Fonksiyon
    function filterApartments() {
      const input = document.getElementById('apartmentSearchInput');
      const query = input ? input.value.toLowerCase().trim() : '';

      const filtered = allApartments.filter(apt => {
        const aptNoMatch = apt.apartment_number ? apt.apartment_number.toString().toLowerCase().includes(query) : false;
        const residentMatch = apt.resident_name ? apt.resident_name.toLowerCase().includes(query) : false;
        const phoneMatch = apt.phone ? apt.phone.toLowerCase().includes(query) : false;
        
        const searchMatches = aptNoMatch || residentMatch || phoneMatch;

        if (showOnlyDebt) {
          return searchMatches && apt.hasDebt;
        }

        return searchMatches;
      });

      renderApartments(filtered);
    }

    // Sadece Borçlular Filtre Butonu Aç/Kapat
    function toggleDebtFilter() {
      showOnlyDebt = !showOnlyDebt;
      updateDebtFilterBtnStyle();
      filterApartments();
    }

    // Filtre Butonunun Görünümünü Güncelleme
    function updateDebtFilterBtnStyle() {
      const btn = document.getElementById('toggleDebtFilterBtn');
      if (!btn) return;

      if (showOnlyDebt) {
        btn.className = "px-4 py-2.5 bg-red-600 text-white border border-red-600 rounded-xl text-sm font-medium transition flex items-center justify-center gap-2 whitespace-nowrap shadow-sm";
        btn.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Tüm Daireleri Göster`;
      } else {
        btn.className = "px-4 py-2.5 bg-gray-100 hover:bg-red-50 text-gray-600 hover:text-red-600 border border-gray-200 hover:border-red-200 rounded-xl text-sm font-medium transition flex items-center justify-center gap-2 whitespace-nowrap shadow-sm";
        btn.innerHTML = `<i class="fa-solid fa-filter"></i> Sadece Borçlular`;
      }
    }
</script>
</body>
</html>
